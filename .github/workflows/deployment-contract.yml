name: Deployment contract (static + UI runtime)
on:
  push:
  pull_request:
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose baseline + secure override
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          INTERNAL_API_KEY: ci-placeholder-not-a-secret
        run: docker compose -f docker-compose.yml -f deploy/compose/compose.yaml config --quiet
      - name: Validate single-directory rootless overlay
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          INTERNAL_API_KEY: ci-placeholder-not-a-secret
          GAMMA_HOME: /home/runner/gamma-home
        run: |
          mkdir -p "$GAMMA_HOME/data/postgres" "$GAMMA_HOME/data/opensearch"
          docker compose -f docker-compose.yml -f deploy/compose/compose.yaml -f deploy/compose/compose.rootless.yaml config --quiet
      - name: Check rootless preflight shell syntax
        run: |
          sh -n deploy/scripts/check-rootless-home.sh
          sh -n deploy/scripts/audit-rootless-compose.sh
          sh -n deploy/scripts/smoke-rootless.sh
      - name: Test rootless preflight with mocked Docker
        run: python3 deploy/scripts/test-rootless-preflight.py -v
      - name: Assert rootless bind mounts and non-root users
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          INTERNAL_API_KEY: ci-placeholder-not-a-secret
          GAMMA_HOME: /home/runner/gamma-home
        run: |
          docker compose --profile relay --profile observability-demo -f docker-compose.yml -f deploy/compose/compose.yaml -f deploy/compose/compose.rootless.yaml config --format json > compose-rendered.json
          python3 - <<'PY'
          import json, os
          with open("compose-rendered.json", encoding="utf-8") as f:
              services = json.load(f)["services"]
          home = os.environ["GAMMA_HOME"]
          for name in ("postgres", "opensearch"):
              mounts = services[name]["volumes"]
              assert len(mounts) == 1, (name, mounts)
              assert mounts[0]["type"] == "bind", (name, mounts)
              assert mounts[0]["source"].startswith(home + "/data/"), (name, mounts)
          for name in ("api", "outbox-relay"):
              assert services[name]["user"] == "10001:10001"
          assert services["frontend"]["security_opt"] == ["no-new-privileges:true"]
          print("Compose rootless static contract: OK")
          PY
  ui-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root UI image
        run: docker build -t gamma-ui:ci frontend
      - name: Assert UI image non-root user and unprivileged port
        run: |
          test "$(docker image inspect gamma-ui:ci --format '{{.Config.User}}')" = "101:101"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user 101:101 --entrypoint nginx gamma-ui:ci -t
      - name: Smoke test running UI with dropped capabilities
        run: |
          set -eu
          docker run -d --name gamma-ui-smoke --cap-drop ALL --security-opt no-new-privileges --user 101:101 -p 127.0.0.1:18080:8080 gamma-ui:ci
          trap 'docker logs gamma-ui-smoke || true; docker rm -f gamma-ui-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18080/ -o ui-response.html; then
              grep -qi '<html' ui-response.html
              docker inspect --format '{{.State.Running}}' gamma-ui-smoke | grep -qx true
              docker inspect --format '{{.HostConfig.Privileged}}' gamma-ui-smoke | grep -qx false
              test "$(docker inspect --format '{{.Config.User}}' gamma-ui-smoke)" = "101:101"
              exit 0
            fi
            sleep 1
          done
          echo "Non-root UI did not respond over HTTP" >&2
          exit 1
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Helm lint and template
        run: |
          helm lint deploy/helm/gamma
          helm template gamma deploy/helm/gamma --namespace gamma > /tmp/gamma-rendered.yaml
          test -s /tmp/gamma-rendered.yaml
