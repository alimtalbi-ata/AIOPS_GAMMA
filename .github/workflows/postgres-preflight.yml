name: PostgreSQL application role preflight
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: gamma-role-preflight-ci
      POSTGRES_PASSWORD: ci-disposable-bootstrap-password
      APP_DB_PASSWORD: ci-disposable-application-password
      INTERNAL_API_KEY: ci-disposable-internal-key
    steps:
      - uses: actions/checkout@v4
      - name: Qualify fresh and existing PostgreSQL volume
        run: |
          set -eu
          docker compose up -d --wait postgres
          sql() {
            docker compose exec -T postgres psql -X -U aiops -d aiops -v ON_ERROR_STOP=1 -c "$1"
          }
          preflight() {
            docker compose run --rm --no-deps -T postgres-preflight
          }
          reject() {
            if preflight > /tmp/gamma-role-preflight.log 2>&1; then
              echo "Unsafe configuration accepted" >&2
              exit 1
            fi
            cat /tmp/gamma-role-preflight.log
            grep -q "Preflight failed: $1" /tmp/gamma-role-preflight.log
          }
          preflight
          sql "ALTER ROLE gamma_app BYPASSRLS"
          reject "unsafe gamma_app attributes"
          sql "ALTER ROLE gamma_app NOBYPASSRLS"
          sql "CREATE ROLE gamma_ci_bridge NOLOGIN; GRANT pg_read_all_data TO gamma_ci_bridge; GRANT gamma_ci_bridge TO gamma_app"
          reject "privileged role memberships"
          sql "REVOKE gamma_ci_bridge FROM gamma_app; DROP ROLE gamma_ci_bridge"
          sql "GRANT aiops TO gamma_app"
          reject "privileged role memberships"
          sql "REVOKE aiops FROM gamma_app"
          preflight
          sql "ALTER ROLE gamma_app RENAME TO gamma_ci_saved"
          docker compose stop postgres
          docker compose rm -f postgres
          docker compose up -d --wait postgres
          reject "gamma_app does not exist"
          sql "ALTER ROLE gamma_ci_saved RENAME TO gamma_app"
          preflight
      - name: Qualify migrated schema and reject security drift
        run: |
          set -eu
          docker compose run --rm -T migrate
          audit() {
            docker compose run --rm --no-deps -T postgres-schema-audit
          }
          sql() {
            docker compose exec -T postgres psql -X -U aiops -d aiops -v ON_ERROR_STOP=1 -c "$1"
          }
          audit
          sql "ALTER TABLE public.integration_inbox NO FORCE ROW LEVEL SECURITY"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'missing table or forced RLS' /tmp/schema-audit.log
          sql "ALTER TABLE public.integration_inbox FORCE ROW LEVEL SECURITY"
          sql "GRANT TRUNCATE ON public.integration_inbox TO gamma_app"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe table privilege' /tmp/schema-audit.log
          sql "REVOKE TRUNCATE ON public.integration_inbox FROM gamma_app"
          audit
          sql "CREATE POLICY gamma_ci_widen ON public.integration_inbox USING (true)"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unexpected policy' /tmp/schema-audit.log
          sql "DROP POLICY gamma_ci_widen ON public.integration_inbox"
          sql "ALTER POLICY tenant_isolation ON public.integration_inbox USING (true)"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'tenant policy drift' /tmp/schema-audit.log
          sql "ALTER POLICY tenant_isolation ON public.integration_inbox USING (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid)"
          audit
          sql "ALTER ROLE gamma_outbox_worker LOGIN"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe worker role attributes' /tmp/schema-audit.log
          sql "ALTER ROLE gamma_outbox_worker NOLOGIN"
          sql "ALTER ROLE gamma_outbox_worker BYPASSRLS"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe worker role attributes' /tmp/schema-audit.log
          sql "ALTER ROLE gamma_outbox_worker NOBYPASSRLS"
          sql "GRANT gamma_outbox_worker TO gamma_app"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe worker role memberships' /tmp/schema-audit.log
          sql "REVOKE gamma_outbox_worker FROM gamma_app"
          sql "CREATE ROLE gamma_ci_worker_bridge NOLOGIN; GRANT pg_read_all_data TO gamma_ci_worker_bridge; GRANT gamma_ci_worker_bridge TO gamma_outbox_worker"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe worker role memberships' /tmp/schema-audit.log
          sql "REVOKE gamma_ci_worker_bridge FROM gamma_outbox_worker; DROP ROLE gamma_ci_worker_bridge"
          audit
          sql "ALTER POLICY worker_self ON public.outbox_worker_identity USING (true)"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'worker identity policy drift' /tmp/schema-audit.log
          sql "ALTER POLICY worker_self ON public.outbox_worker_identity USING (login_name = session_user)"
          sql "GRANT UPDATE (tenant_id) ON public.outbox_worker_identity TO gamma_outbox_worker"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe worker identity privileges' /tmp/schema-audit.log
          sql "REVOKE UPDATE (tenant_id) ON public.outbox_worker_identity FROM gamma_outbox_worker"
          sql "GRANT SELECT ON public.outbox_worker_identity TO gamma_app"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe worker identity privileges' /tmp/schema-audit.log
          sql "REVOKE SELECT ON public.outbox_worker_identity FROM gamma_app"
          audit
          sql "GRANT UPDATE (tenant_id) ON public.integration_outbox TO gamma_outbox_worker"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe outbox worker column privileges' /tmp/schema-audit.log
          sql "REVOKE UPDATE (tenant_id) ON public.integration_outbox FROM gamma_outbox_worker"
          sql "REVOKE UPDATE (attempts) ON public.integration_outbox FROM gamma_outbox_worker"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unsafe outbox worker column privileges' /tmp/schema-audit.log
          sql "GRANT UPDATE (attempts) ON public.integration_outbox TO gamma_outbox_worker"
          sql "GRANT SELECT ON public.integration_inbox TO gamma_outbox_worker"
          if audit > /tmp/schema-audit.log 2>&1; then exit 1; fi
          grep -q 'unexpected worker access outside outbox' /tmp/schema-audit.log
          sql "REVOKE SELECT ON public.integration_inbox FROM gamma_outbox_worker"
          audit
      - name: Verify schema gate dependency contract
        run: |
          docker compose config --format json > /tmp/gamma-gate.json
          python3 - <<'PY'
          import json
          with open("/tmp/gamma-gate.json") as f:
              services = json.load(f)["services"]
          assert services["postgres-schema-audit"]["depends_on"]["migrate"]["condition"] == "service_completed_successfully"
          assert services["api"]["depends_on"]["postgres-schema-audit"]["condition"] == "service_completed_successfully"
          PY
      - name: Verify Compose Gateway registry propagation
        run: |
          set -eu
          unset GATEWAY_ASSERTION_KEYS
          docker compose config --format json > /tmp/gamma-default.json
          GATEWAY_ASSERTION_KEYS='{"ci-key":"disposable-test-value-not-a-real-secret"}' docker compose config --format json > /tmp/gamma-keys.json
          python3 - <<'PY'
          import json
          def env(path):
              with open(path) as f:
                  return json.load(f)["services"]["api"]["environment"]
          assert env("/tmp/gamma-default.json").get("GATEWAY_ASSERTION_KEYS") in (None, "{}")
          assert json.loads(env("/tmp/gamma-keys.json")["GATEWAY_ASSERTION_KEYS"]) == {"ci-key": "disposable-test-value-not-a-real-secret"}
          PY
      - name: Remove disposable CI project
        if: always()
        run: docker compose down --volumes --remove-orphans
