name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Compile application and tests before importing pytest
        run: python -m compileall -q app tests scripts migrations deploy/scripts
      - name: Run Python tests (excluding opt-in PostgreSQL suites)
        run: |
          mkdir -p rc01-evidence
          python -m pytest -q -rs --junitxml=rc01-evidence/pytest.xml --ignore=tests/test_gateway_replay_postgres.py --ignore=tests/test_resource_list_http_postgres.py --ignore=tests/test_evidence_http_postgres_e2e.py 2>&1 | tee rc01-evidence/pytest.log
        shell: bash
      - name: Record qualification provenance
        if: always()
        run: |
          mkdir -p rc01-evidence
          git rev-parse HEAD > rc01-evidence/sha.txt
          python --version > rc01-evidence/python.txt
          python -m pip freeze > rc01-evidence/dependencies.txt
      - name: Upload RC-01 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc01-pytest-evidence
          path: rc01-evidence/
          retention-days: 14
          if-no-files-found: error

  intelligence-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Qualify offline intelligence previews
        run: |
          python -m pytest -q tests/test_unified_telemetry.py tests/test_telemetry_correlation.py tests/test_telemetry_evidence_graph.py tests/test_telemetry_rca_analyst.py tests/test_telemetry_rca_critic.py tests/test_telemetry_copilot.py tests/test_telemetry_human_review.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Smoke Vite preview API denial and SPA availability
        run: |
          node --input-type=module <<'JS'
          import { spawn } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';

          // Launch Vite directly: terminating an npm wrapper may leave its
          // child server running and mask a subsequent port collision.
          const server = spawn(process.execPath, ['node_modules/vite/bin/vite.js', 'preview', '--port', '4173', '--strictPort'], {
            stdio: 'ignore',
            env: process.env,
          });
          const base = 'http://127.0.0.1:4173';
          async function request(path, method = 'GET') {
            return fetch(base + path, { method, signal: AbortSignal.timeout(2000) });
          }
          try {
            let ready = false;
            for (let i = 0; i < 30; i++) {
              if (server.exitCode !== null) throw new Error('Vite preview exited before readiness');
              try {
                const response = await request('/');
                if (response.status === 200) {
                  if (!(await response.text()).toLowerCase().includes('<html')) {
                    throw new Error('Preview root is not HTML');
                  }
                  ready = true;
                  break;
                }
              } catch (error) {
                if (error.message === 'Preview root is not HTML') throw error;
              }
              await delay(300);
            }
            if (!ready) throw new Error('Vite preview not ready');
            for (const path of ['/api', '/api/', '/api/v1/demo/correlation', '/api/v1/demo/investigation', '/api/v1/private?x=1']) {
              for (const method of ['GET', 'POST']) {
                const response = await request(path, method);
                if (response.status !== 404) {
                  throw new Error(method + ' ' + path + ': expected 404, got ' + response.status);
                }
                if (response.headers.get('cache-control') !== 'no-store') {
                  throw new Error(method + ' ' + path + ': missing no-store');
                }
              }
            }
          } finally {
            if (server.exitCode === null && server.signalCode === null) {
              server.kill('SIGTERM');
              await Promise.race([
                new Promise(resolve => server.once('exit', resolve)),
                delay(3000),
              ]);
              if (server.exitCode === null && server.signalCode === null) {
                server.kill('SIGKILL');
              }
            }
          }
          JS

  gateway-replay-postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://gamma:ci-disposable-replay-password@127.0.0.1:5432/gamma_replay_test
      GAMMA_REPLAY_TEST_DATABASE_URL: postgresql+asyncpg://gamma:ci-disposable-replay-password@127.0.0.1:5432/gamma_replay_test
      GAMMA_REPLAY_TEST_ALLOW_WRITE: I_UNDERSTAND_DISPOSABLE_DB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Start disposable PostgreSQL on actual loopback
        run: |
          docker run --detach --name gamma-replay-ci --network host \
            -e POSTGRES_DB=gamma_replay_test -e POSTGRES_USER=gamma \
            -e POSTGRES_PASSWORD=ci-disposable-replay-password \
            postgres:16 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 60); do
            if docker exec gamma-replay-ci pg_isready -h 127.0.0.1 -U gamma -d gamma_replay_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply reviewed replay migration to disposable PostgreSQL
        # This suite exercises revision 0002 only; full head is qualified separately by RLS CI.
        run: alembic upgrade 0002_gateway_replay
      - name: Verify replay migration downgrade and re-upgrade on disposable PostgreSQL
        run: |
          alembic downgrade 0001_initial
          alembic upgrade 0002_gateway_replay
          python - <<'PY'
          import asyncio
          import os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def check():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              try:
                  async with engine.connect() as conn:
                      assert await conn.scalar(text("SELECT current_database()")) == "gamma_replay_test"
                      assert await conn.scalar(text("SELECT version_num FROM alembic_version")) == "0002_gateway_replay"
                      assert await conn.scalar(text("SELECT to_regclass('gateway_assertion_replay')")) is not None
              finally:
                  await engine.dispose()

          asyncio.run(check())
          PY
      - name: Exercise real PostgreSQL replay concurrency and commit behavior
        run: python -m pytest -q tests/test_gateway_replay_postgres.py

      - name: Remove disposable replay database
        if: always()
        run: docker rm -f gamma-replay-ci || true

  tenant-evidence-postgres-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://gamma_app:ci-disposable-tenant-password@127.0.0.1:5432/gamma_tenant_test
      GAMMA_TENANT_TEST_DATABASE_URL: postgresql+asyncpg://gamma_app:ci-disposable-tenant-password@127.0.0.1:5432/gamma_tenant_test
      GAMMA_TENANT_TEST_ALLOW_WRITE: I_UNDERSTAND_DISPOSABLE_DB
      PGPASSWORD: ci-root-bootstrap-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Start disposable tenant PostgreSQL on actual loopback
        run: |
          docker run --detach --name gamma-tenant-ci --network host \
            -e POSTGRES_DB=gamma_tenant_test -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-root-bootstrap-only \
            postgres:16 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 60); do
            if docker exec gamma-tenant-ci pg_isready -h 127.0.0.1 -U postgres -d gamma_tenant_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Provision non-superuser PostgreSQL role for disposable E2E
        run: |
          psql -h 127.0.0.1 -U postgres -d gamma_tenant_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE gamma_app LOGIN PASSWORD 'ci-disposable-tenant-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          SQL
      - name: Apply reviewed Alembic migrations as disposable migration administrator
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci-root-bootstrap-only@127.0.0.1:5432/gamma_tenant_test
        run: alembic upgrade head
      - name: Grant read-only migration metadata to disposable runtime
        run: psql -h 127.0.0.1 -U postgres -d gamma_tenant_test -v ON_ERROR_STOP=1 -c 'GRANT SELECT ON alembic_version TO gamma_app'
      - name: Verify exact PostgreSQL database and migration before E2E
        run: |
          python - <<'PY'
          import asyncio
          import os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              try:
                  async with engine.connect() as conn:
                      assert await conn.scalar(text("select current_database()")) == "gamma_tenant_test"
                      assert await conn.scalar(text("select version_num from alembic_version")) == "0007_replay_lock_only"
                      assert await conn.scalar(text("select current_user")) == "gamma_app"
                      assert await conn.scalar(text("select rolbypassrls from pg_roles where rolname=current_user")) is False
                      assert await conn.scalar(text("select rolsuper from pg_roles where rolname=current_user")) is False
                      assert await conn.scalar(text("select to_regclass('investigation_evidence')")) is not None
              finally:
                  await engine.dispose()

          asyncio.run(main())
          PY
      - name: Run HTTP PostgreSQL tenant isolation and evidence lifecycle
        run: python -m pytest -q -rs tests/test_resource_list_http_postgres.py tests/test_evidence_http_postgres_e2e.py

      - name: Remove disposable tenant database
        if: always()
        run: docker rm -f gamma-tenant-ci || true

  rc01-replay-cleanup-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Start isolated disposable PostgreSQL
        run: |
          docker run -d --name gamma-rc01-ci --network host \
            -e POSTGRES_DB=gamma_rc01_test -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-rc01-bootstrap-only \
            postgres:16 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 60); do
            if docker exec gamma-rc01-ci pg_isready -h 127.0.0.1 -U postgres -d gamma_rc01_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Provision restricted application role and migrate full head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci-rc01-bootstrap-only@127.0.0.1:5432/gamma_rc01_test
        run: |
          docker exec gamma-rc01-ci psql -U postgres -d gamma_rc01_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gamma_app LOGIN PASSWORD 'ci-rc01-app-only' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
          alembic upgrade head
          alembic downgrade 0006_worker_role_guard
          alembic upgrade head
          docker exec gamma-rc01-ci psql -U postgres -d gamma_rc01_test -v ON_ERROR_STOP=1 -c 'GRANT SELECT ON alembic_version TO gamma_app'
      - name: Verify disposable target and run exact three cases
        env:
          GAMMA_TEST_DATABASE_URL: postgresql+asyncpg://gamma_app:ci-rc01-app-only@127.0.0.1:5432/gamma_rc01_test
        run: |
          mkdir -p rc01-replay
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def check():
              engine = create_async_engine(os.environ["GAMMA_TEST_DATABASE_URL"])
              try:
                  async with engine.connect() as c:
                      for sql, expected in [
                          ("SELECT current_database()", "gamma_rc01_test"),
                          ("SELECT current_user", "gamma_app"),
                          ("SELECT host(inet_server_addr())", "127.0.0.1"),
                          ("SELECT version_num FROM alembic_version", "0007_replay_lock_only"),
                          ("SELECT rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname=current_user", False),
                          ("SELECT count(*) FROM gateway_assertion_replay", 0),
                          ("SELECT count(*) FROM pg_class WHERE relname IN ('integration_inbox','integration_outbox','telemetry_service_bindings','investigation_evidence') AND relrowsecurity AND relforcerowsecurity", 4),
                      ]:
                          actual = await c.scalar(text(sql))
                          assert actual == expected, (sql, actual, expected)
              finally:
                  await engine.dispose()
          asyncio.run(check())
          PY
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.exc import DBAPIError
          from sqlalchemy.ext.asyncio import create_async_engine
          async def check():
              engine = create_async_engine(os.environ["GAMMA_TEST_DATABASE_URL"])
              try:
                  async with engine.begin() as c:
                      assert not await c.scalar(text("SELECT has_table_privilege(current_user, 'public.gateway_assertion_replay', 'UPDATE')"))
                      assert not await c.scalar(text("SELECT has_column_privilege(current_user, 'public.gateway_assertion_replay', 'assertion_digest', 'UPDATE')"))
                      assert await c.scalar(text("SELECT has_column_privilege(current_user, 'public.gateway_assertion_replay', 'expires_at', 'UPDATE')"))
                      assert await c.scalar(text("SELECT count(*) FROM pg_trigger WHERE tgrelid='public.gateway_assertion_replay'::regclass AND tgname='replay_immutable_update' AND tgenabled='A'")) == 1
                      assert await c.scalar(text("SELECT count(*) FROM pg_trigger t JOIN pg_proc p ON p.oid=t.tgfoid JOIN pg_class r ON r.oid=t.tgrelid WHERE r.oid='public.gateway_assertion_replay'::regclass AND t.tgname='replay_immutable_update' AND t.tgtype=18 AND t.tgenabled='A' AND p.oid='public.reject_replay_update()'::regprocedure AND NOT p.prosecdef AND NOT pg_has_role(current_user,p.proowner,'MEMBER') AND NOT pg_has_role(current_user,r.relowner,'MEMBER') AND p.proconfig=ARRAY['search_path=pg_catalog']")) == 1
                      assert not await c.scalar(text("SELECT has_function_privilege(current_user,'public.reject_replay_update()','EXECUTE')"))
                      body = await c.scalar(text("SELECT prosrc FROM pg_proc WHERE oid='public.reject_replay_update()'::regprocedure"))
                      assert " ".join(body.split()) == "BEGIN RAISE EXCEPTION 'Replay reservations are immutable' USING ERRCODE = '42501'; END;"

                      assert await c.scalar(text("SELECT has_table_privilege(current_user,'public.gateway_assertion_replay','DELETE')"))
                      for table in ("integration_inbox","integration_outbox","telemetry_service_bindings","investigation_evidence"):
                          assert await c.scalar(text("SELECT count(*) FROM public."+table)) == 0

                      await c.execute(text("INSERT INTO public.gateway_assertion_replay VALUES (repeat('a',64), now()+interval '10 minutes')"))
                  for sql in [
                      "UPDATE public.gateway_assertion_replay SET expires_at=now()",
                      "UPDATE public.gateway_assertion_replay SET expires_at=expires_at WHERE false",
                      "UPDATE public.gateway_assertion_replay SET assertion_digest=repeat('b',64)",
                      "ALTER TABLE public.gateway_assertion_replay DISABLE TRIGGER replay_immutable_update",
                      "TRUNCATE public.gateway_assertion_replay",
                  ]:
                      try:
                          async with engine.begin() as c:
                              await c.execute(text(sql))
                      except DBAPIError as exc:
                          assert getattr(exc.orig, "sqlstate", None) == "42501", str(exc)
                          print("DENIED:", sql)
                      else:
                          raise AssertionError("Unexpected success: "+sql)
                  async with engine.begin() as c:
                      assert await c.scalar(text("SELECT count(*) FROM public.gateway_assertion_replay WHERE assertion_digest=repeat('a',64) AND expires_at>now()")) == 1
                      await c.execute(text("DELETE FROM public.gateway_assertion_replay WHERE assertion_digest=repeat('a',64)"))
              finally:
                  await engine.dispose()
          asyncio.run(check())
          PY
          python -m pytest -v -rs --junitxml=rc01-replay/pytest.xml \
            tests/test_gateway_replay.py::test_replay_reservation_is_atomic_across_independent_postgres_sessions \
            tests/test_gateway_replay.py::test_postgres_cleanup_preserves_live_rows_and_respects_batch_limit \
            tests/test_gateway_replay.py::test_two_postgres_cleanup_workers_race_with_fresh_gateway_authentication
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("rc01-replay/pytest.xml").findall(".//testcase")
          assert len(cases) == 3 and all(not any(c.find(t) is not None for t in ("skipped","failure","error")) for c in cases)
          PY
      - name: Upload exact replay qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc01-replay-evidence
          path: rc01-replay/
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable database
        if: always()
        run: docker rm -f gamma-rc01-ci || true
