name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  gateway-replay-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gamma_replay_test
          POSTGRES_USER: gamma
          POSTGRES_PASSWORD: ci-disposable-replay-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamma -d gamma_replay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://gamma:ci-disposable-replay-password@127.0.0.1:5432/gamma_replay_test
      GAMMA_REPLAY_TEST_DATABASE_URL: postgresql+asyncpg://gamma:ci-disposable-replay-password@127.0.0.1:5432/gamma_replay_test
      GAMMA_REPLAY_TEST_ALLOW_WRITE: I_UNDERSTAND_DISPOSABLE_DB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Apply reviewed migrations to disposable PostgreSQL
        run: alembic upgrade head
      - name: Exercise real PostgreSQL replay concurrency and commit behavior
        run: python -m pytest -q tests/test_gateway_replay_postgres.py
