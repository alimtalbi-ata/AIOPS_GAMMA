name: PostgreSQL RLS qualification
on:
  workflow_dispatch:
  push:
    branches: [feat/observability-foundation, feat/gamma-ux-integrated-qualification, qualify/gamma-rc01-59f3627, integrate/ux15.42.2-n-foundation-replay-20261119]
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - '.github/workflows/postgres-rls.yml'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamma_admin
          POSTGRES_PASSWORD: disposable_admin
          POSTGRES_DB: gamma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamma_admin -d gamma_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://gamma_admin:disposable_admin@127.0.0.1:5432/gamma_test
      GAMMA_TEST_DATABASE_URL: postgresql+asyncpg://gamma_app:disposable_runtime@127.0.0.1:5432/gamma_test
      GAMMA_TEST_DISPOSABLE: "1"
      GAMMA_WORKER_ADMIN_DSN: postgresql://gamma_admin:disposable_admin@127.0.0.1:5432/gamma_test
      GAMMA_WORKER_A_DSN: postgresql://gamma_worker_a:disposable_a@127.0.0.1:5432/gamma_test
      GAMMA_WORKER_B_DSN: postgresql://gamma_worker_b:disposable_b@127.0.0.1:5432/gamma_test
      INTERNAL_API_KEY: disposable-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - name: Bootstrap restricted role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(user="gamma_admin", password="disposable_admin",
                                           database="gamma_test", host="127.0.0.1")
              try:
                  await conn.execute("CREATE ROLE gamma_app LOGIN PASSWORD 'disposable_runtime' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Historical migration round trip and forward-only head
        run: |
          alembic upgrade 0008_replay_maintenance
          alembic downgrade 0002_gateway_replay
          alembic upgrade 0008_replay_maintenance
          alembic upgrade head
          if alembic downgrade 0008_replay_maintenance > /tmp/replay-downgrade.log 2>&1; then exit 1; fi
          grep -q 'Replay security downgrade refused' /tmp/replay-downgrade.log
          python - <<'PY'
          import asyncio, os, asyncpg
          async def check():
              c = await asyncpg.connect(os.environ["GAMMA_WORKER_ADMIN_DSN"])
              try:
                  assert await c.fetchval("SELECT version_num FROM alembic_version") == "0009_replay_bounded"
                  assert not await c.fetchval("SELECT has_table_privilege('gamma_app','public.gateway_assertion_replay','DELETE')")
                  assert not await c.fetchval("SELECT has_table_privilege('gamma_replay_maintenance','public.gateway_assertion_replay','DELETE')")
                  assert await c.fetchval("SELECT has_function_privilege('gamma_replay_maintenance','replay_maintenance.purge_expired(integer,integer)','EXECUTE')")
              finally:
                  await c.close()
          asyncio.run(check())
          PY
          alembic upgrade head
      - name: Provision disposable worker identities
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              conn = await asyncpg.connect(os.environ["GAMMA_WORKER_ADMIN_DSN"])
              try:
                  await conn.execute("CREATE ROLE gamma_worker_a LOGIN PASSWORD 'disposable_a' NOSUPERUSER NOBYPASSRLS IN ROLE gamma_outbox_worker")
                  await conn.execute("CREATE ROLE gamma_worker_b LOGIN PASSWORD 'disposable_b' NOSUPERUSER NOBYPASSRLS IN ROLE gamma_outbox_worker")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Verify Compose and Helm gate parity and negative drift guards
        run: |
          cmp postgres/preflight/01-app-role.sql deploy/helm/gamma/preflight/01-app-role.sql
          cmp postgres/preflight/02-schema-security.sql deploy/helm/gamma/preflight/02-schema-security.sql
          python -m pytest -q tests/test_postgres_security_gate.py
      - name: Behavioral isolation
        run: python -m pytest -q tests/test_tenant_isolation.py tests/test_rls_all_tables.py tests/test_tenant_session_context.py tests/test_resource_acl.py tests/test_business_permissions.py tests/test_signed_business_permissions.py tests/test_gateway_cross_key_replay.py tests/test_outbox_worker_postgres.py tests/test_outbox_role_preflight.py tests/test_outbox_hold.py tests/test_outbox_claim.py tests/test_outbox_receiver_contract.py tests/test_outbox_durable_receiver.py tests/test_outbox_transaction_model.py --junitxml=rls-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-rls-results
          path: rls-results.xml
          if-no-files-found: warn
