[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-gamma"
version = "0.1.0"
requires-python = ">=3.11"
description = "AIOps Observability integration services"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.29,<1",
  "opensearch-py[async]>=2.7,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
