server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  # Public synthetic demo only. Never proxy authenticated tenant endpoints.
  location = /api/v1/demo/investigation {
    proxy_pass http://api:8000/api/v1/demo/investigation;
    # Public demos need no browser-supplied request headers.
    proxy_pass_request_headers off;
    # GET-only public demo; HEAD is implicitly permitted by Nginx.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host api;
    proxy_connect_timeout 3s;
    proxy_send_timeout 8s;
    proxy_read_timeout 8s;
    proxy_buffering off;
    proxy_set_header X-Internal-Api-Key "";
    proxy_set_header X-Gateway-Principal "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Tenant-ID "";
    proxy_set_header X-Forwarded-User "";
    # Location-level add_header disables inheritance of server-level security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    limit_except GET { deny all; }
  }
  location = /api/v1/demo/correlation {
    proxy_pass http://api:8000/api/v1/demo/correlation;
    # Public demos need no browser-supplied request headers.
    proxy_pass_request_headers off;
    # GET-only public demo; HEAD is implicitly permitted by Nginx.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host api;
    proxy_connect_timeout 3s;
    proxy_send_timeout 8s;
    proxy_read_timeout 8s;
    proxy_buffering off;
    proxy_set_header X-Internal-Api-Key "";
    proxy_set_header X-Gateway-Principal "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Tenant-ID "";
    proxy_set_header X-Forwarded-User "";
    # Location-level add_header disables inheritance of server-level security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    limit_except GET { deny all; }
  }
  # Reject every other API path; never return SPA HTML for protected endpoints.
  # The exact /api path must not fall through to the SPA index.
  location = /api {
    # Defining Cache-Control here suppresses inherited add_header directives.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location ^~ /api/ {
    # Denied API responses must not be cached by shared intermediaries.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
