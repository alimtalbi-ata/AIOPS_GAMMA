services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    restart: unless-stopped
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gamma_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/aiops
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      GATEWAY_ASSERTION_SECRET: ${GATEWAY_ASSERTION_SECRET:-}
      GATEWAY_ASSERTION_KEYS:
      GATEWAY_ASSERTION_ISSUER: ${GATEWAY_ASSERTION_ISSUER:-gamma-gateway}
      GATEWAY_ASSERTION_AUDIENCE: ${GATEWAY_ASSERTION_AUDIENCE:-aiops-gamma}
      GATEWAY_ASSERTION_MAX_TTL_SECONDS: ${GATEWAY_ASSERTION_MAX_TTL_SECONDS:-60}
      OPENSEARCH_URL: http://opensearch:9200
      ENABLE_OPENSEARCH: ${ENABLE_OPENSEARCH:-false}
      ENABLE_ALERT_INGESTION: ${ENABLE_ALERT_INGESTION:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)) == {'status': 'ok'}"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
  postgres-preflight:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["psql", "-X", "-h", "postgres", "-U", "aiops", "-d", "aiops", "-v", "ON_ERROR_STOP=1", "-f", "/preflight/01-app-role.sql"]
    volumes:
      - ./postgres/preflight/01-app-role.sql:/preflight/01-app-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://aiops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aiops
    depends_on:
      postgres-preflight:
        condition: service_completed_successfully
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aiops
      APP_DB_USER: gamma_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 10
  outbox-relay:
    build: .
    profiles: [relay]
    command: ["python", "-m", "app.outbox_relay"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gamma_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/aiops
      CORRELATION_WEBHOOK_URL: ${CORRELATION_WEBHOOK_URL:-}
      CORRELATION_WEBHOOK_TOKEN: ${CORRELATION_WEBHOOK_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  opensearch:
    image: opensearchproject/opensearch:2.19.4
    profiles: [observability-demo]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [osdata:/usr/share/opensearch/data]
volumes:
  pgdata:
  osdata:
