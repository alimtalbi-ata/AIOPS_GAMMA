global:
  imagePullPolicy: IfNotPresent
  # Use immutable image digests in staging/production.
api:
  image: ghcr.io/alimtalbi-ata/aiops-gamma-api:replace-with-pinned-tag
  # PostgreSQL 16 client; pin an immutable digest for release.
  securityGateImage: postgres:16-alpine
  replicas: 1
  port: 8000
  internalApiKeySecret: gamma-api-credentials
  internalApiKeySecretKey: internal-api-key
  # Leave empty until the trusted gateway contract and secret are provisioned.
  gatewayAssertionSecret: ""
  gatewayAssertionSecretKey: principal-hmac-key
  # Existing Kubernetes Secret containing a JSON map of key IDs to HMAC keys.
  # Empty name disables injection; never store actual keys in values.yaml.
  gatewayAssertionKeysSecret: ""
  gatewayAssertionKeysSecretKey: principal-hmac-keys
  gatewayAssertionIssuer: gamma-gateway
  gatewayAssertionAudience: aiops-gamma
  gatewayAssertionMaxTtlSeconds: 60
  # Empty selectors intentionally produce an API ingress deny-all policy.
  gatewayNamespaceLabels: {}
  gatewayPodLabels: {}
  databaseUrlSecret: gamma-database
  databaseUrlSecretKey: url
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
ui:
  image: ghcr.io/alimtalbi-ata/aiops-gamma-ui:replace-with-pinned-tag
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
ingress:
  enabled: false
  className: ""
  host: gamma.example.invalid
  tlsSecret: ""
