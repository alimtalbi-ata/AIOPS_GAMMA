{{- if and .Values.api.gatewayAssertionSecret .Values.api.gatewayAssertionKeysSecret }}
{{- fail "Configure either gatewayAssertionSecret or gatewayAssertionKeysSecret, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {app.kubernetes.io/name: gamma-api, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: gamma-api, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gamma-api, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: postgres-security-gate
          image: {{ .Values.api.securityGateImage | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.api.databaseUrlSecret | quote }}, key: {{ .Values.api.databaseUrlSecretKey | quote }}}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              case "$DATABASE_URL" in
                postgresql+asyncpg://*) PGDATABASE="postgresql://${DATABASE_URL#postgresql+asyncpg://}" ;;
                *) echo "Unsupported application database URL" >&2; exit 1 ;;
              esac
              export PGDATABASE
              # libpq needs an explicit default user for numeric UIDs without passwd entries.
              export PGUSER=gamma_app
              unset DATABASE_URL
              export PGCONNECT_TIMEOUT=10
              test "$(psql -X -At -v ON_ERROR_STOP=1 --dbname="$PGDATABASE" -c 'SELECT session_user')" = gamma_app
              psql -X -v ON_ERROR_STOP=1 --dbname="$PGDATABASE" -f /preflight/01-app-role.sql
              psql -X -v ON_ERROR_STOP=1 --dbname="$PGDATABASE" -f /preflight/02-schema-security.sql
          volumeMounts:
            - {name: postgres-security-gate, mountPath: /preflight, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: postgres-security-gate
          configMap:
            name: {{ .Release.Name }}-postgres-security-gate
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.api.internalApiKeySecret | quote }}, key: {{ .Values.api.internalApiKeySecretKey | quote }}}
            - name: GATEWAY_ASSERTION_ISSUER
              value: {{ .Values.api.gatewayAssertionIssuer | quote }}
            - name: GATEWAY_ASSERTION_AUDIENCE
              value: {{ .Values.api.gatewayAssertionAudience | quote }}
            - name: GATEWAY_ASSERTION_MAX_TTL_SECONDS
              value: {{ .Values.api.gatewayAssertionMaxTtlSeconds | quote }}
            {{- if .Values.api.gatewayAssertionSecret }}
            - name: GATEWAY_ASSERTION_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.api.gatewayAssertionSecret | quote }}, key: {{ .Values.api.gatewayAssertionSecretKey | quote }}}
            {{- end }}
            {{- if .Values.api.gatewayAssertionKeysSecret }}
            - name: GATEWAY_ASSERTION_KEYS
              valueFrom:
                secretKeyRef: {name: {{ .Values.api.gatewayAssertionKeysSecret | quote }}, key: {{ required "gatewayAssertionKeysSecretKey is required" .Values.api.gatewayAssertionKeysSecretKey | quote }}}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.api.databaseUrlSecret | quote }}, key: {{ .Values.api.databaseUrlSecretKey | quote }}}
            - name: ENABLE_OPENSEARCH
              value: "false"
            - name: ENABLE_ALERT_INGESTION
              value: "false"
            - name: ENABLE_GLPI_READS
              value: "false"
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: gamma-api, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.api.port }}, targetPort: http}]
