apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ui-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gamma-ui, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: {{ .Values.ui.port }}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gamma-api, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
{{- if and (gt (len .Values.api.gatewayNamespaceLabels) 0) (gt (len .Values.api.gatewayPodLabels) 0) }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.api.gatewayNamespaceLabels | indent 14 }}
          podSelector:
            matchLabels:
{{ toYaml .Values.api.gatewayPodLabels | indent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.api.port }}}]
{{- else }}
  # Explicit empty ingress list: deny all API ingress until the gateway
  # namespace and pod selectors are supplied by the platform owner.
  ingress: []
{{- end }}
