apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels: {app.kubernetes.io/name: gamma-ui, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: gamma-ui, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gamma-ui, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: {{ .Values.ui.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.ui.port }}}]
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 15
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: gamma-ui, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.ui.port }}, targetPort: http}]
