# Experimental PostgreSQL non-root override. NOT qualified on rootless Docker.
# Apply AFTER compose.rootless.yaml on a dedicated disposable host only.
# Requires explicit bind ownership/UID mapping preparation and runtime proof.
services:
  postgres:
    user: "10001:10001"
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    cap_drop: [ALL]
    cap_add: []
